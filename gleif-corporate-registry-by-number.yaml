version: '1'
kind: miner
id: 0
slug: truth-gleif-corporate-registry-by-number
name: GLEIF registry lookup by registration number
description: Free, public, no-key API of the Global Legal Entity Identifier Foundation (GLEIF), the official global register of legal entities, sourced from national business registers. Returns legal name, national registration number, entity status, jurisdiction, registered (legal) address and creation date. This source matches the national registration number exactly (for example 0805587591 for Tesla, Inc. in Texas), so there is no fuzzy name matching. Use it when the request gives a registry identifier rather than a name. Only entities that hold an LEI are covered.
base_url: https://api.gleif.org
auth:
  type: none
endpoints:
- path: /corporate-lookup
  external_path: /api/v1/lei-records
  method: GET
  description: Looks up a legal entity by its exact national registration number within a country. The best match is the first record, data.0. Fields are under data.0.attributes.entity. If nothing matches, data is an empty list, so the answer is missing rather than wrong.
  intents:
  - CORPORATE_REGISTRY_LOOKUP_GENERAL
  params:
    query:
      required:
      - name: filter[entity.registeredAs]
        type: string
        intents: ['*']
        description: National registration number exactly as the registry issues it, for example 0805587591.
      - name: filter[entity.legalAddress.country]
        type: string
        intents: ['*']
        description: ISO 3166-1 alpha-2 country code in upper case, for example US, GB, NG, DE.
      - name: page[size]
        type: string
        intents: ['*']
        description: Always 1, so only the best match is returned.
intent_mapping:
  CORPORATE_REGISTRY_LOOKUP_GENERAL:
    endpoint: /corporate-lookup
    input:
      filter[entity.registeredAs]:
        from: company
        how: "The registry identifier exactly as given, for example 0805587591. If the request gives only a company name and no number, this source does not apply."
      filter[entity.legalAddress.country]:
        from: jurisdiction
        how: "ISO 3166-1 alpha-2 country code in upper case. Examples: United States, USA, US, Texas, Delaware -> US. United Kingdom, UK, England -> GB. Nigeria -> NG. Germany -> DE. France -> FR. India -> IN. Canada -> CA."
      page[size]:
        from: company
        how: "Always the literal value 1, whatever the input."
    output:
      legal_name: { path: data.0.attributes.entity.legalName.name }
      registration_id: { path: data.0.attributes.entity.registeredAs }
      active: { path: data.0.attributes.entity.status }
      jurisdiction: { path: data.0.attributes.entity.jurisdiction }
      registered_address: { path: data.0.attributes.entity.legalAddress }
      incorporated: { path: data.0.attributes.entity.creationDate }
semantics:
  supported_intents:
  - CORPORATE_REGISTRY_LOOKUP_GENERAL
