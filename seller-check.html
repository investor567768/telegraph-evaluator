<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller check: pool liquidity from both truth sources</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; color: #1d1d1f; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.note { color: #555; margin-top: 0; }
  .pools button { margin: 0 6px 6px 0; padding: 6px 10px; border: 1px solid #ccc; background: #f6f6f6; border-radius: 6px; cursor: pointer; font-size: 13px; }
  label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
  input, select { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; margin-top: 4px; }
  #run { margin-top: 16px; padding: 10px 18px; font-size: 15px; background: #c2410c; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 15px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e5e5; }
  td.num { font-variant-numeric: tabular-nums; }
  #seller { margin-top: 18px; }
  #verdict { margin-top: 12px; font-weight: 600; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
<h1>Seller check</h1>
<p class="note">Reads one pool's liquidity from both truth sources (DexScreener and GeckoTerminal) at the same moment, so a Telegraph seller's answer can be compared with them. Free, no key, runs in your browser.</p>

<div class="pools" id="pools"></div>

<label for="chain">Chain</label>
<select id="chain">
  <option value="ethereum">ethereum</option>
  <option value="base">base</option>
  <option value="bsc">bsc</option>
  <option value="arbitrum">arbitrum</option>
  <option value="polygon">polygon</option>
</select>

<label for="pool">Pool address</label>
<input id="pool" placeholder="0x...">

<label for="sellerVal">Seller's answer in USD (optional, paste from the Anjoman job)</label>
<input id="sellerVal" placeholder="e.g. 77251912.58, 75.07M or 750k">

<button id="run">Read both sources now</button>

<table id="out" hidden>
  <tr><th>Source</th><th>Liquidity (USD)</th><th>Seller vs this source</th><th>Replied at (UTC)</th></tr>
  <tr><td>DexScreener</td><td class="num" id="ds">…</td><td class="num" id="dsd"></td><td class="num" id="dst"></td></tr>
  <tr><td>GeckoTerminal</td><td class="num" id="gt">…</td><td class="num" id="gtd"></td><td class="num" id="gtt"></td></tr>
</table>
<p class="note" id="srcgap"></p>
<p class="note" id="sellerRead"></p>
<div id="verdict"></div>
<p class="note" id="when"></p>

<script>
const GT = { ethereum: 'eth', base: 'base', bsc: 'bsc', arbitrum: 'arbitrum', polygon: 'polygon_pos' };
const PRESETS = [
  ['ethereum', '0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640', 'Ethereum WETH/USDC'],
  ['base', '0x72ab388e2e2f6facef59e3c3fa2c4e29011c2d38', 'Base WETH/USDC'],
  ['bsc', '0x172fcd41e0913e95784454622d1c3724f546f849', 'BSC USDT/WBNB'],
  ['arbitrum', '0xc6962004f452be9203591991d15f6b388e09e8d0', 'Arbitrum USDC/WETH'],
  ['polygon', '0x9b08288c3be4f62bbf8d1c20ac9c5e6f9467d8b7', 'Polygon WPOL/USDT']
];
const poolsDiv = document.getElementById('pools');
PRESETS.forEach(([c, a, name]) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { document.getElementById('chain').value = c; document.getElementById('pool').value = a; };
  poolsDiv.appendChild(b);
});

const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nowUTC = () => new Date().toISOString().replace('T', ' ').slice(0, 19);

// Reads a seller's number. Accepts plain numbers ("75,070,000", "$75070000.12")
// and k / m / b suffixes ("750k", "75.07M", "1.2b"). Anything else is refused,
// so "75.07M" can never be silently read as $75.07.
function parseAmount(raw) {
  const t = raw.trim().replace(/^\$/, '').replace(/\s*usd$/i, '').replace(/[,\s]/g, '');
  if (t === '') return { empty: true };
  const m = t.match(/^(\d+(?:\.\d+)?)([kmb])?$/i);
  if (!m) return { error: `Couldn't read "${raw.trim()}" as a dollar amount. Use a plain number like 75070000, or a k / m / b suffix like 75.07M.` };
  const mult = { k: 1e3, m: 1e6, b: 1e9 }[(m[2] || '').toLowerCase()] || 1;
  return { value: Number(m[1]) * mult };
}

class SourceError extends Error {}
async function getJSON(url) {
  let r;
  try { r = await fetch(url, { headers: { accept: 'application/json' } }); }
  catch (e) { throw new SourceError('Could not reach this source (network error). Try again.'); }
  if (r.status === 404) throw new SourceError('Pool not found on this chain. Check the chain.');
  if (r.status === 429) throw new SourceError('This source is busy (too many requests). Wait a minute and try again.');
  if (!r.ok) throw new SourceError('Source error (HTTP ' + r.status + ').');
  return r.json();
}
function readValue(v) {
  if (v == null) throw new SourceError('Pool not found on this chain. Check the chain.');
  const n = Number(v);
  if (!isFinite(n)) throw new SourceError('Source returned an unreadable value.');
  if (n <= 0) throw new SourceError("Source returned 0, so there's nothing to compare against.");
  return n;
}

document.getElementById('run').onclick = async () => {
  const chain = document.getElementById('chain').value;
  const pool = document.getElementById('pool').value.trim().toLowerCase();
  const parsed = parseAmount(document.getElementById('sellerVal').value);
  const seller = parsed.value;
  document.getElementById('out').hidden = false;
  ['ds', 'gt'].forEach(id => { document.getElementById(id).textContent = '…'; document.getElementById(id + 'd').textContent = ''; document.getElementById(id + 't').textContent = ''; });
  ['verdict', 'srcgap', 'sellerRead'].forEach(id => { document.getElementById(id).textContent = ''; });
  document.getElementById('verdict').classList.remove('err');
  if (parsed.error) { document.getElementById('sellerRead').innerHTML = ''; const e = document.createElement('span'); e.className = 'err'; e.textContent = parsed.error; document.getElementById('sellerRead').appendChild(e); }
  else if (seller != null) document.getElementById('sellerRead').textContent = `Seller's answer read as $${fmt(seller)}.`;

  const results = {};
  const jobs = [
    getJSON(`https://api.dexscreener.com/latest/dex/pairs/${chain}/${pool}`)
      .then(j => { results.ds = readValue(j.pairs && j.pairs[0] && j.pairs[0].liquidity ? j.pairs[0].liquidity.usd : null); })
      .catch(e => { results.dsErr = e instanceof SourceError ? e.message : 'Unexpected reply from this source.'; })
      .finally(() => { results.dsAt = nowUTC(); }),
    getJSON(`https://api.geckoterminal.com/api/v2/networks/${GT[chain]}/pools/${pool}`)
      .then(j => { results.gt = readValue(j.data && j.data.attributes ? j.data.attributes.reserve_in_usd : null); })
      .catch(e => { results.gtErr = e instanceof SourceError ? e.message : 'Unexpected reply from this source.'; })
      .finally(() => { results.gtAt = nowUTC(); })
  ];
  await Promise.all(jobs);
  for (const k of ['ds', 'gt']) {
    const cell = document.getElementById(k);
    document.getElementById(k + 't').textContent = results[k + 'At'];
    if (results[k] != null) {
      cell.textContent = fmt(results[k]);
      if (seller != null) { const pct = (seller - results[k]) / results[k] * 100; document.getElementById(k + 'd').textContent = (Math.abs(pct) < 0.005 ? 0 : pct).toFixed(2) + '%'; }
    } else { cell.innerHTML = ''; const e = document.createElement('span'); e.className = 'err'; e.textContent = results[k + 'Err']; cell.appendChild(e); }
  }
  const verdict = document.getElementById('verdict');
  if (results.ds != null && results.gt != null) {
    const srcGap = Math.abs(results.ds - results.gt) / Math.min(results.ds, results.gt) * 100;
    document.getElementById('srcgap').textContent = `The two sources differ from each other by ${srcGap.toFixed(2)}%.`;
    if (seller != null) {
      if (srcGap > 2) {
        verdict.textContent = `No verdict: the two truth sources disagree by ${srcGap.toFixed(2)}% (more than 2%), so no answer could fairly pass. Try again in a minute.`;
      } else {
        const worst = Math.max(Math.abs(seller - results.ds) / results.ds, Math.abs(seller - results.gt) / results.gt) * 100;
        verdict.textContent = worst <= 2 ? `Within 2% of both truth sources (largest gap ${worst.toFixed(2)}%).` : `Outside 2% of at least one truth source (largest gap ${worst.toFixed(2)}%).`;
      }
    }
  } else if (seller != null) {
    verdict.textContent = 'No verdict: at least one truth source gave no value (see the table).';
  }
  document.getElementById('when').textContent = `Read at ${nowUTC()} UTC · chain ${chain} · pool ${pool}`;
};
</script>
</body>
</html>
